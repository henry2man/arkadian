# GoReleaser config — https://goreleaser.com
# Local test, no publish: goreleaser release --snapshot --clean --skip=publish
version: 2

# The display name is Arkadian. The command, the archives, and the cask keep the
# short name ark.
project_name: ark

before:
  hooks:
    - go mod tidy

builds:
  - id: ark
    main: ./cmd/ark
    binary: ark
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # No windows: ark shells out to rsync and ssh.

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

release:
  name_template: "{{ .Tag }}"

# Homebrew: disabled while the repo is private. Homebrew cannot read a private
# repo, so this needs the repo public plus the tap repo henry2man/homebrew-arkadian.

name: ci

on:
  push:
    branches: [main, first-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-latest
            platform: linux/arm64
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
          - name: darwin-arm64
            os: macos-latest
            platform: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4

      # ponytail: QEMU on an amd64 runner, works while the repository is private.
      # Upgrade path: runs-on ubuntu-2404-arm for native arm64 when the repository is public.
      - name: Enable cross-architecture containers
        if: matrix.platform != '' && matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Container tests
        if: matrix.platform != ''
        run: |
          docker build --platform ${{ matrix.platform }} -f Dockerfile.dev -t ark-dev .
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src ark-dev

      - uses: actions/setup-python@v5
        if: matrix.platform == ''
        with:
          python-version: '3.12'

      - name: macOS tools
        if: matrix.platform == ''
        run: |
          brew install go rsync
          python -m pip install 'huggingface_hub[cli]==1.5.0'

      - name: macOS tests
        if: matrix.platform == ''
        run: scripts/test.sh

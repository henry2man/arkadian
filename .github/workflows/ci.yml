name: ci

on:
  push:
    branches: [main, first-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runtime tools
        run: python -m pip install 'huggingface_hub==1.5.0'

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          test -z "$bad" || { echo "$bad"; echo "fix with: gofmt -w ."; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: |
          out=$(go test ./... 2>&1); status=$?
          if [ $status -ne 0 ]; then
            printf '%s\n' "$out" | tail -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: build
        run: go build -o bin/ark ./cmd/ark

      - name: smoke
        run: ./bin/ark version

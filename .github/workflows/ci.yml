name: ci

on:
  push:
    branches: [main, first-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7

      # No go.sum: the project has no external Go modules, so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # click is explicit: huggingface_hub 1.5.0 needs typer, and typer 0.27 dropped it.
      - name: Runtime tools
        run: python -m pip install 'huggingface_hub==1.5.0' 'click>=8.0'

      - name: Check
        run: scripts/test.sh
